# Labels applied automatically from the files a pull request touches.
#
# The point is not tidiness: several of these are what the stale bot and the
# pull-request workflow filter on.

python:
  - changed-files:
      - any-glob-to-any-file: python/**

typescript:
  - changed-files:
      - any-glob-to-any-file: typescript/**

# A change to the vectors is a change to the behaviour of both editions.
shared-vectors:
  - changed-files:
      - any-glob-to-any-file: shared/**

# The mechanism the whole library rests on. Anything under it is worth a second
# reviewer, and it is always at least a minor version.
core:
  - changed-files:
      - any-glob-to-any-file:
          - python/src/rankmode/curves.py
          - python/src/rankmode/fixed.py
          - python/src/rankmode/rating.py
          - python/src/rankmode/ladder.py
          - typescript/src/curves.ts
          - typescript/src/exact.ts
          - typescript/src/fixed.ts
          - typescript/src/rating.ts
          - typescript/src/ladder.ts

# The competitive half. Separate from `core` because most of it is policy a
# caller configures rather than arithmetic everybody depends on.
ranked:
  - changed-files:
      - any-glob-to-any-file:
          - python/src/rankmode/ranked.py
          - python/src/rankmode/season.py
          - python/src/rankmode/matchmaking.py
          - typescript/src/ranked.ts
          - typescript/src/season.ts
          - typescript/src/matchmaking.ts

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "**/examples/**"

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - python/tests/**
          - typescript/tests/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - typescript/package.json
          - typescript/package-lock.json
          - python/pyproject.toml
